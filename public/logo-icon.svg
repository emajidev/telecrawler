<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Tech Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#cyber-grad)" stroke-width="2.5" opacity="0.6" stroke-dasharray="180 20 40 20" />
  <circle cx="50" cy="50" r="46" stroke="#00F0FF" stroke-width="1" opacity="0.3" stroke-dasharray="10 15 5 15" />
  
  <!-- Diagonal Slash Orbit -->
  <ellipse cx="50" cy="50" rx="44" ry="16" transform="rotate(-30 50 50)" stroke="#00F0FF" stroke-width="2" opacity="0.8" />
  
  <!-- Nova / Star Center Core -->
  <g filter="url(#glow)">
    <!-- Vertical / Horizontal Rays -->
    <path d="M50 8 L54 44 L92 50 L54 56 L50 92 L46 56 L8 50 L46 44 Z" fill="url(#cyber-grad)" />
    <!-- Diagonal Subtle Rays -->
    <path d="M50 25 L52.5 45 L72.5 50 L52.5 55 L50 75 L47.5 55 L27.5 50 L47.5 45 Z" fill="#FFFFFF" opacity="0.85" />
    <!-- Center Core Dot -->
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
  </g>
</svg>
